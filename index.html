<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kode Kelas</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/siswa.css"></head>
<body>
<div id="note" class="note" hidden></div>
<header class="bar"><b class="brand">Kode Kelas</b><div id="userbox" hidden><span id="who"></span><button id="out" class="btn alt sm">Keluar</button></div></header>
<main>
<section id="auth" hidden>
<h1>Pamerkan codingan kamu</h1><p class="meta">Upload folder proyek HTML, CSS, dan JS, lalu bagikan lewat link sendiri.</p>
<div class="card"><div class="tabs"><button class="on" data-t="login">Masuk</button><button data-t="reg">Daftar</button></div>
<input id="u" placeholder="Username (huruf kecil, angka)" autocapitalize="none" autocomplete="username">
<input id="p" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password">
<button id="go" class="btn">Masuk</button></div>
</section>
<section id="home" hidden>
<h1>Proyek saya</h1>
<div id="grid" class="grid"></div>
</section>
<section id="proj" hidden>
<button id="back" class="btn alt sm">Kembali ke semua proyek</button>
<div class="card head"><h1 id="pt"></h1><div id="pl" class="meta"></div>
<div class="row"><button id="pren" class="btn alt sm">Ganti judul</button><button id="ppub" class="btn sm"></button><button id="pdel" class="btn danger sm">Hapus proyek</button></div></div>
<div class="card"><div id="crumbs" class="crumbs"></div>
<div class="row" style="margin:0 0 6px"><button id="upf" class="btn sm">Upload file</button><button id="upd" class="btn sm alt">Upload folder</button><button id="mkd" class="btn sm alt">Folder baru</button><button id="rmd" class="btn sm danger" hidden>Hapus folder ini</button></div>
<div id="files"></div><p id="hint" class="meta"></p></div>
</section>
</main>
<input type="file" id="fi" multiple hidden><input type="file" id="fo" webkitdirectory multiple hidden><input type="file" id="fr" hidden>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
</body></html>
