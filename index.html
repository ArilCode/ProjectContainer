<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kode Kelas</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css"></head>
<body>
<div id="note" class="note" hidden></div>
<main>
<section id="auth" hidden>
<h1>Kode Kelas</h1><p class="meta">Simpan codingan HTML, CSS, dan JS kamu, lalu bagikan lewat link sendiri.</p>
<div class="card"><div class="tabs"><button class="on" data-t="login">Masuk</button><button data-t="reg">Daftar</button></div>
<input id="u" placeholder="Username (huruf kecil, angka)" autocapitalize="none" autocomplete="username">
<input id="p" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password">
<button id="go" class="btn">Masuk</button></div>
</section>
<section id="dash" hidden>
<div class="top"><h1 id="who"></h1><button id="out" class="btn alt">Keluar</button></div>
<button id="new" class="btn">Codingan baru</button>
<div id="list"></div>
</section>
</main>
<dialog id="ed">
<h3>Codingan</h3>
<label for="t">Judul</label><input id="t" placeholder="Contoh: Game tebak angka">
<label for="html">HTML</label><input type="file" accept=".html,.htm,.txt" data-to="html"><textarea id="html"></textarea>
<label for="css">CSS</label><input type="file" accept=".css,.txt" data-to="css"><textarea id="css"></textarea>
<label for="js">JS</label><input type="file" accept=".js,.txt" data-to="js"><textarea id="js"></textarea>
<div class="row"><button id="save" class="btn">Simpan</button><button id="cancel" class="btn alt">Batal</button></div>
</dialog>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
</body></html>
